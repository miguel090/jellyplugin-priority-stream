name: CI

on:
  push:
    branches: ['**']
    tags-ignore: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test -c Release

      - name: Build plugin
        run: dotnet publish src/Jellyfin.Plugin.LiveTvPriority -c Release -o out

      - uses: actions/upload-artifact@v4
        with:
          name: Jellyfin.Plugin.LiveTvPriority
          path: out/Jellyfin.Plugin.LiveTvPriority.dll
